[project]
name = "numberwang"
version = "0.1.0"
description = "A small neural network that decides whether a number is Numberwang"
readme = "README.md"
authors = [
    { name = "Sebastian Korotkiewicz", email = "skorotkiewicz@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
numberwang = "numberwang:main"
numberwang-app = "numberwang.app:main"
numberwang-train = "numberwang.train_numberwang:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
# Demo UI (gradio) — `uv sync --extra app`
app = ["gradio>=4.44"]
# CPU training via PyTorch — `uv sync --extra cpu`
cpu = ["numpy>=1.26", "num2words>=0.5.14", "torch>=2.3"]
# GPU training/inference via PyTorch CUDA 12.8 — `uv sync --extra gpu`
gpu = ["numpy>=1.26", "num2words>=0.5.14", "torch>=2.3"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "gradio>=4.44",
    "num2words>=0.5.14",
    "torch>=2.9.1",
]
